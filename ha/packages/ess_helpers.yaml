# ESS optimizer helpers. Put this file in /config/packages/ (homeassistant: packages: !include_dir_named packages).
# No `initial` values on purpose: HA restores the last value after a restart. Set the values once after the
# first start; docs/configuration.md lists the reference values of the author's system.
input_number:
  ess_battery_capacity:
    name: ESS battery capacity
    min: 20.0
    max: 40.0
    step: 0.5
    mode: box
    unit_of_measurement: kWh
    icon: mdi:battery-high
  ess_energy_tax:
    name: ESS energy tax
    min: 0.0
    max: 200.0
    step: 0.01
    mode: box
    unit_of_measurement: öre/kWh
    icon: mdi:bank
  ess_ev_charge_power:
    name: ESS EV charge power
    min: 1000.0
    max: 11000.0
    step: 100.0
    mode: box
    unit_of_measurement: W
    icon: mdi:ev-station
  ess_ev_cold_temp:
    name: ESS EV cold temp
    min: -30.0
    max: 15.0
    step: 1.0
    mode: box
    unit_of_measurement: °C
    icon: mdi:snowflake-thermometer
  ess_ev_finish_margin:
    name: ESS EV finish margin
    min: 0.0
    max: 180.0
    step: 5.0
    mode: box
    unit_of_measurement: min
    icon: mdi:timer-sand
  ess_ev_guest_current:
    name: ESS EV guest current
    min: 6.0
    max: 16.0
    step: 1.0
    mode: slider
    unit_of_measurement: A
    icon: mdi:current-ac
  ess_ev_kwh_per_percent:
    name: ESS EV kWh per percent
    min: 0.1
    max: 0.5
    step: 0.01
    mode: box
    unit_of_measurement: kWh/%
    icon: mdi:car-battery
  ess_ev_manual_target:
    name: ESS EV manual target
    min: 20.0
    max: 100.0
    step: 1.0
    mode: slider
    unit_of_measurement: '%'
    icon: mdi:battery-charging-80
  ess_ev_max_reachable_soc:

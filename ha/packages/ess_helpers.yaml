input_boolean:
  ess_allow_battery_export:
    name: ESS allow battery export
    icon: mdi:battery-arrow-up
  ess_allow_battery_to_ev:
    name: ESS allow battery to EV
    icon: mdi:home-battery
  ess_allow_grid_charge:
    name: ESS allow grid charge
    icon: mdi:transmission-tower-import
  ess_allow_solar_export:
    name: ESS allow solar export
    icon: mdi:solar-power
  ess_block_export_negative_price:
    name: ESS block export negative price
    icon: mdi:currency-usd-off
  ess_ev_guest_mode:
    name: ESS EV guest mode
    icon: mdi:account-arrow-right
  ess_ev_manual_departure:
    name: ESS EV manual departure
    icon: mdi:calendar-clock
  ess_ev_preheat:
    name: ESS EV preheat
    icon: mdi:car-seat-heater
  ess_ev_smart_control:
    name: ESS EV smart control
    icon: mdi:car-cog
  ess_ev_use_learned:
    name: ESS EV use learned
    icon: mdi:school
  ess_force_full_charge:
    name: ESS force full charge
    icon: mdi:battery-sync
  ess_measured_efficiency:
    name: ESS measured efficiency
    icon: mdi:chart-bell-curve-cumulative
input_select:
  ess_ev_mode:
    name: ESS EV mode
    options:
    - Auto
    - Charge now
    - 'Off'
    icon: mdi:ev-station
  ess_ev_next_departure:
    name: ESS EV next departure
    options:
    - Auto
    - 'Yes'
    - 'No'
    icon: mdi:car-clock
  ess_ev_season:
    name: ESS EV season
    options:
    - Auto
    - Summer
    - Winter
    icon: mdi:sun-snowflake-variant
  ess_mode:
    name: ESS mode
    options:
    - Auto
    - Self-consumption
    - Hold
    - Charge now
    - Export now
    - Victron default
    icon: mdi:home-battery-outline
  ess_pv_source:
    name: ESS PV source
    options:
    - Open-Meteo
    - VRM
    icon: mdi:solar-power-variant
input_datetime:
  ess_ev_departure:
    name: ESS EV departure
    has_date: false
    has_time: true
    icon: mdi:car-clock
  ess_ev_manual_departure_time:
    name: ESS EV manual departure time
    has_date: true
    has_time: true
    icon: mdi:clock-end
  ess_override_until:
    name: ESS override until
    has_date: true
    has_time: true
    icon: mdi:clock-end
